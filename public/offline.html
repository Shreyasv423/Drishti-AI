<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRISHTI — Offline Mode</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #08101E;
        color: #F8FAFC;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      main {
        max-width: 34rem;
        background: #0F1C30;
        border: 2px solid #38BDF8;
        border-radius: 1.25rem;
        padding: 2rem;
      }
      h1 { margin-top: 0; font-size: 1.75rem; }
      p { line-height: 1.6; color: #CBD5E1; }
      button {
        margin-top: 1rem;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        background: #FBBF24;
        color: #08101E;
        border: none;
        border-radius: 0.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <h1>You are currently offline</h1>
      <p>
        DRISHTI could not load a new page because there is no internet connection.
        Return to the cached DRISHTI app to use local OCR reading, color detection,
        spoken playback, and saved trusted contacts.
      </p>
      <button type="button" onclick="window.location.href='/'">Open DRISHTI Offline</button>
    </main>
  </body>
</html>
